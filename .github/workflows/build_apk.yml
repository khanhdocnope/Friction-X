name: Build Friction-X (Android APK & Windows EXE)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ==========================================
  # 1. BUILD ANDROID APK
  # ==========================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Re-generate Flutter Android project files
        run: flutter create . --project-name friction_x --platforms=android --org com.frictionx.app

      - name: Force Upgrade Gradle Wrapper to 8.4
        run: |
          sed -i 's/gradle-.*-all.zip/gradle-8.4-all.zip/g' android/gradle/wrapper/gradle-wrapper.properties || true

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Friction-X-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  # ==========================================
  # 2. BUILD WINDOWS DESKTOP (.EXE)
  # ==========================================
  build-windows:
    name: Build Windows EXE
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Enable & Generate Windows Platform Support
        run: |
          flutter config --enable-windows-desktop
          flutter create . --project-name friction_x --platforms=windows --org com.frictionx.app

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows Executable (Release)
        run: flutter build windows --release

      - name: Compress Windows Build Directory
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath build\Friction-X-Windows-x64.zip

      - name: Upload Windows ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Friction-X-Windows-EXE
          path: build/Friction-X-Windows-x64.zip
          retention-days: 14
